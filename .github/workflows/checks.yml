name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified during preparation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified during preparation
        with:
          python-version: '3.12'
      - name: Check publication contents
        run: python tools/check_publication.py
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Security regression tests
        run: python -m pytest tests -q
      - name: Critical Python lint checks
        run: ruff check .
      - name: Known dependency vulnerabilities
        run: python -m pip_audit --disable-pip --no-deps -r requirements.txt
